    <rect x="28" y="38" width="52" height="40" rx="8" fill="#fff"/>
    <rect x="34" y="44" width="18" height="12" rx="3" fill="#7AA2FF"/>
    <rect x="56" y="44" width="18" height="12" rx="3" fill="#AFC8FF"/>
    <rect x="34" y="60" width="40" height="4" rx="2" fill="#D6E6FF"/>
    <rect x="34" y="68" width="28" height="4" rx="2" fill="#D6E6FF"/>
  </g>
  <g filter="url(#s1)">
    <rect x="78" y="54" width="54" height="42" rx="8" fill="#fff" transform="rotate(8 105 75)"/>
    <rect x="86" y="62" width="38" height="16" rx="4" fill="#2F6BFF" transform="rotate(8 105 70)"/>
    <rect x="86" y="82" width="30" height="4" rx="2" fill="#D6E6FF" transform="rotate(8 101 84)"/>
