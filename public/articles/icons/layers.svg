      <stop stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#D6E6FF"/>
    </linearGradient>
    <filter id="s1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2F6BFF" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#bg1)"/>
  <!-- desk -->
